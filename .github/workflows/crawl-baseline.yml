name: Baseline Daily Crawl

on:
  schedule:
    # Daily full-catalog baseline crawl at 06:00 UTC (~2-3 min/day => ~60-90 min/month)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      brand:
        description: "Comma-separated brand slugs (leave blank for all verified pilot brands)"
        required: false
        default: ""
      mode:
        description: "Crawl mode"
        required: false
        default: "manual"
        type: choice
        options:
          - baseline
          - high-frequency
          - manual
      max_products:
        description: "Optional safety-cap override per brand (leave blank to use brand config default of 5000)"
        required: false
        default: ""

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run standalone full-catalog TypeScript crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRAWLER_CONTACT_EMAIL: ${{ secrets.CRAWLER_CONTACT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          BRAND_ARG=""
          if [ -n "${{ github.event.inputs.brand }}" ]; then
            BRAND_ARG="--brand=${{ github.event.inputs.brand }}"
          fi
          MAX_ARG=""
          if [ -n "${{ github.event.inputs.max_products }}" ]; then
            MAX_ARG="--max=${{ github.event.inputs.max_products }}"
          fi
          MODE="${{ github.event.inputs.mode || 'baseline' }}"
          npx tsx crawler/run.ts $BRAND_ARG --mode=$MODE $MAX_ARG
