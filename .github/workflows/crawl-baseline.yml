name: Baseline Daily Crawl

on:
  schedule:
    # Daily incremental baseline crawl at 06:00 UTC (never runs --force-refresh)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      brand:
        description: "Comma-separated brand slugs (leave blank for all active brands: faherty,bonobos,brooks-brothers,vineyard-vines)"
        required: false
        default: ""
      mode:
        description: "Crawl mode"
        required: false
        default: "manual"
        type: choice
        options:
          - baseline
          - high-frequency
          - manual
      force_refresh:
        description: "Manual sale-week override only: ignore 7-day skip and re-fetch every in-stock URL (still respects robots.txt & rate limits)"
        required: false
        default: false
        type: boolean
      offset:
        description: "Optional 0-based URL offset for splitting a manual forced pass across runs (e.g. 0, 600, 1200, 1800)"
        required: false
        default: "0"
      max_products:
        description: "Optional batch size / safety-cap override per brand (leave blank for brand config default)"
        required: false
        default: ""

# Queue concurrent runs targeting the same brand instead of overlapping and doubling request rate.
# Runs for different brands use distinct concurrency keys and proceed independently.
concurrency:
  group: crawl-${{ inputs.brand || 'all' }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run standalone TypeScript crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRAWLER_CONTACT_EMAIL: ${{ secrets.CRAWLER_CONTACT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRAND_ARG=""
            if [ -n "${{ github.event.inputs.brand }}" ]; then
              BRAND_ARG="--brand=${{ github.event.inputs.brand }}"
            fi
            MAX_ARG=""
            if [ -n "${{ github.event.inputs.max_products }}" ]; then
              MAX_ARG="--max=${{ github.event.inputs.max_products }}"
            fi
            OFFSET_ARG=""
            if [ -n "${{ github.event.inputs.offset }}" ] && [ "${{ github.event.inputs.offset }}" != "0" ]; then
              OFFSET_ARG="--offset=${{ github.event.inputs.offset }}"
            fi
            FORCE_ARG=""
            if [ "${{ github.event.inputs.force_refresh }}" = "true" ]; then
              FORCE_ARG="--force-refresh"
            fi
            MODE="${{ github.event.inputs.mode || 'manual' }}"
            npx tsx crawler/run.ts $BRAND_ARG --mode=$MODE $OFFSET_ARG $MAX_ARG $FORCE_ARG
          else
            # Scheduled cron runs ALWAYS use normal incremental baseline mode (never --force-refresh)
            npx tsx crawler/run.ts --mode=baseline
          fi

      - name: Evaluate price-drop alerts (no-op when ALERTS_MODE=local)
        env:
          ALERTS_MODE: ${{ vars.ALERTS_MODE || 'local' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npx tsx crawler/check-alerts.ts
