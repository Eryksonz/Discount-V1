name: High-Frequency Sale & Alert Crawl (Opt-In)

on:
  schedule:
    # Every 4 hours; exits immediately (<2s) when 0 brands are opted in.
    # Always uses normal incremental mode (never --force-refresh).
    # Tip: Disable this workflow in GitHub -> Actions when no brands are opted in to save ~180 billed min/month.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      brand:
        description: "Optional comma-separated brand slugs (leave blank for opt-in high-frequency brands)"
        required: false
        default: ""

# Shares the exact same concurrency group as crawl-baseline.yml so no two crawler runs can ever
# overlap and hit the same brand domain simultaneously.
concurrency:
  group: tape-and-tailor-crawl
  cancel-in-progress: false

jobs:
  high-freq-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run opt-in high-frequency crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRAWLER_CONTACT_EMAIL: ${{ secrets.CRAWLER_CONTACT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          BRAND_ARG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.brand }}" ]; then
            BRAND_ARG="--brand=${{ github.event.inputs.brand }}"
          fi
          npx tsx crawler/run.ts $BRAND_ARG --mode=high-frequency

      - name: Evaluate price-drop alerts (no-op when ALERTS_MODE=local)
        env:
          ALERTS_MODE: ${{ vars.ALERTS_MODE || 'local' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npx tsx crawler/check-alerts.ts
